[workspace]
members = [
    "crates/voidline-protocol",
    "crates/voidlined",
    "crates/voidlinectl",
    "crates/voidline-terminal",
]
resolver = "2"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ShadowOkami4/voidline"

[workspace.metadata.voidline]
display-version = "0.3.0dev"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
nix = { version = "0.30", features = ["fs", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
